# Install once: cd scanner && uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      # The corpus holds exact bytes (hand-written pickles); a fixer that adds
      # a trailing newline would corrupt them and make generate.py disagree.
      - id: end-of-file-fixer
        exclude: ^scanner/tests/corpus/[^/]+\.(pkl|pt|safetensors)$
      - id: trailing-whitespace
        exclude: ^scanner/tests/corpus/[^/]+\.(pkl|pt|safetensors)$
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory scanner ruff check --fix .
        language: system
        files: ^scanner/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory scanner ruff format .
        language: system
        files: ^scanner/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --directory scanner mypy src tests
        language: system
        files: ^scanner/.*\.py$
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run --directory scanner pytest -q
        language: system
        files: ^scanner/
        pass_filenames: false
