name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scanner:
    name: scanner (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - run: uv sync --locked

      - name: ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: mypy
        run: uv run mypy src tests

      - name: pytest
        run: uv run pytest

      - name: CLI smoke test (clean tree -> exit 0)
        run: uv run nitrogen scan src
      - name: CLI smoke test (malicious corpus -> exit 1)
        shell: bash
        run: |
          uv run nitrogen scan tests/corpus && code=0 || code=$?
          test "$code" = "1" || { echo "expected exit 1 on the corpus, got $code"; exit 1; }
