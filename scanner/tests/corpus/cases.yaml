# Expected result for every corpus file. One row = one file.
#   verdict: safe | risk
#   finding: the rule the step-5 analyzer must raise (omit for safe)
#   detail : the dangerous name expected in the finding message (import cases)
#   reason : why, in plain words
# Adding a bypass = adding a file in generate.py and a row here.

