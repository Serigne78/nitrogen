[project]
name = "nitrogen-scanner"
version = "0.1.0"
description = "Static scanner for AI model files: detects unsafe serialization and emits a CycloneDX AI-BOM."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6.0.3",
    "typer>=0.16",
]

[project.scripts]
nitrogen = "nitrogen.cli:app"

[dependency-groups]
dev = [
    "cyclonedx-python-lib[json-validation]>=11.12.0",
    "hypothesis>=6.130",
    "modelscan>=0.8.8",
    "mypy>=1.15",
    "numpy>=2.5.4",
    "picklescan>=1.0.5",
    "pre-commit>=4.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "safetensors>=0.8.0",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nitrogen"]

# --- ruff ---------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "S",            # bandit
    "SIM",          # simplify
    "PTH",          # pathlib
    "RUF",
    "TID",          # banned-api (see below)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of a test

# Rule #1: the scanner never deserializes what it scans.
# Any import of these modules/APIs fails lint, hence CI.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pickle".msg = "Never deserialize scanned files. Use pickletools.genops only."
"_pickle".msg = "Never deserialize scanned files. Use pickletools.genops only."
"cPickle".msg = "Never deserialize scanned files. Use pickletools.genops only."
"dill".msg = "Never deserialize scanned files."
"cloudpickle".msg = "Never deserialize scanned files."
"joblib".msg = "Never deserialize scanned files."
"marshal".msg = "Never deserialize scanned files."
"shelve".msg = "Never deserialize scanned files."
"torch".msg = "The scanner must not depend on torch (torch.load executes pickles)."
"numpy.load".msg = "numpy.load can unpickle. Never deserialize scanned files."

# --- mypy ---------------------------------------------------------------

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

# --- pytest / coverage ----------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--cov=nitrogen", "--cov-report=term-missing"]

[tool.coverage.run]
branch = true
source = ["nitrogen"]

[tool.coverage.report]
fail_under = 90
show_missing = true
